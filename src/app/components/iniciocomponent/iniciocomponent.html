<section class="portada text-center text-white rounded mb-5 animate__animated animate__fadeIn">
  <div class="py-5 px-3">
    <h1 class="display-5 fw-bold"><i class="bi bi-house-heart-fill text-warning"></i> Inversiones LR</h1>
    <p class="lead col-md-8 mx-auto">
      Encuentra alojamientos temporales en las mejores ciudades de Colombia.
      Compara opciones, cotiza tu estadía y reserva en pocos pasos.
    </p>
    <a class="btn btn-warning btn-lg" routerLink="/alojamientos">
      <i class="bi bi-search"></i> Buscar alojamientos
    </a>
  </div>
</section>

<h2 class="mb-4">Alojamientos destacados</h2>

<div class="text-center py-5" *ngIf="cargando">
  <div class="spinner-border text-primary" role="status"></div>
  <p class="text-muted mt-2">Cargando destacados...</p>
</div>

<div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>

<div class="row g-4">
  <div class="col-sm-6 col-lg-4" *ngFor="let alojamiento of destacados">
    <app-tarjetacomponent [alojamiento]="alojamiento"></app-tarjetacomponent>
  </div>
</div>
